[fan]
# What the fan follows:
#   cpu  - the CPU temperature, with the lv0..lv3 thresholds below
#   disk - the hottest disk, with the disk_lv0..disk_lv3 thresholds below.
#          Needs the drivetemp kernel module (loaded at boot by this package);
#          if no disk can be read the fan follows the CPU instead.
source = disk

# Which disks count with source = disk:
#   auto - spinning disks only (SSDs run hotter by design)
#   all  - every disk
#   or a list of names, e.g.: sda sdb
disks = auto

# Above lv0 the fan runs at 25% power, above lv1 at 50%, above lv2 at 75% and
# above lv3 at 100%. Below lv0 it is off. Values in degrees Celsius.
# CPU thresholds:
lv0 = 35
lv1 = 40
lv2 = 45
lv3 = 50
# Disk thresholds (hard disks are happiest between 25 and 45'C):
disk_lv0 = 35
disk_lv1 = 40
disk_lv2 = 43
disk_lv3 = 46

# Software PWM frequency in Hz (boards without hardware PWM, e.g. the
# Raspberry Pi). Some fans stall at low power when the frequency is too low:
# the HAT fan only ran from 75% at the former 40 Hz, and from 25% at 100 Hz.
pwm_freq = 100

[key]
# You can customize the function of the key, currently available functions are
# slider: oled display next page
# switch: fan turn on/off switch
# reboot, poweroff
# If you have any good suggestions for key functions, 
# please add an issue on https://github.com/radxa/rockpi-penta/issues
click = slider
twice = switch
press = none

[time]
# twice: maximum time between double clicking (seconds)
# press: long press time (seconds)
twice = 0.7
press = 1.8

[oled]
# Whether to rotate the text of the oled 180 degrees, whether to use Fahrenheit
rotate = false
f-temp = false
# Whether the oled moves to the next page on its own, and the time per page (seconds)
auto_slide = false
auto_slide_time = 10
# The oled blanks after this many seconds without a button press, to avoid
# burn-in (0 to disable). The first press wakes it up.
sleep = 60
